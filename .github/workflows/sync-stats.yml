name: Sync Stats from npm/GitHub

on:
  schedule:
    # Every 2 hours: keeps the published version, downloads and stars fresh
    # even if the source-repo sync is unavailable.
    - cron: '0 */2 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-stats
  cancel-in-progress: false

jobs:
  sync-stats:
    if: >-
      github.event_name == 'push' ||
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: [self-hosted, Linux, X64, gajae-layofflabs-2]
    steps:
      - name: Checkout website repo
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Refresh data/stats.json from npm + GitHub
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/sync-stats.mjs

      - name: Validate API-derived stats (fail closed)
        run: |
          for key in downloads stars forks; do
            val=$(jq -r --arg k "$key" '.[$k] | if type == "number" then tostring else "invalid" end' data/stats.json)
            if ! printf '%s' "$val" | grep -Eq '^[0-9]+$'; then
              echo "ERROR: data/stats.json $key is not ^[0-9]+$: refusing to continue" >&2
              exit 1
            fi
          done
          ver=$(jq -r '.version | if type == "string" then . else "invalid" end' data/stats.json)
          if ! printf '%s' "$ver" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.+-]+)?$'; then
            echo "ERROR: data/stats.json version is not a semver string: refusing to continue" >&2
            exit 1
          fi

      - name: Propagate published version into static markup
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node -e "console.log(JSON.parse(require('fs').readFileSync('data/stats.json','utf8')).version)")
          echo "Published version: $VERSION"
          OMX_VERSION="$VERSION" node scripts/sync-version.mjs

      - name: Check for changes
        id: check
        run: |
          git add data/stats.json index.html docs.html js/config.js
          if git diff --cached --quiet; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push changes
        if: steps.check.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "site: auto-sync release metadata ($(node -e "const s=require('./data/stats.json');console.log(\`v\${s.version}, downloads: \${s.downloads}, stars: \${s.stars}\`)"))"
          git push
